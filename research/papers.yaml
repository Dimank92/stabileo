- id: shauer-2025
  doi: 10.1016/j.advengsoft.2025.104013
  crossref:
    title: Less than 500 lines self-contained Python finite element implementation of the phase-field
      method for fracture mechanics
    authors:
    - Nathan Shauer
    year: 2025
    venue: Advances in Engineering Software
  area: fracture
  keywords:
  - phase-field
  - AT2
  - brittle fracture
  - staggered scheme
  - educational code
  summary: 'A compact, self-contained Python finite element code for quasi-static brittle fracture with
    the AT2 phase-field model: bilinear quadrilaterals, 2x2 Gauss quadrature, a damage-degraded elasticity
    problem and a damage problem driven by the tensile part of the strain energy, solved alternately until
    the elasticity residual falls below a tolerance. Examples are a bar in tension (compared with the
    1D AT2 analytical response), a single-edge notched plate in tension and a three-point bending test.'
  summary_source: reference-code
  summary_note: phasefield-jr-py read in full at commit 61037c6; paper full text not accessed
  code:
  - url: https://github.com/nathanshauer/phasefield-jr-py
    license: MIT
  - url: https://github.com/nathanshauer/phasefield-jr
    license: MIT
  data: []
  methods:
  - Q4 elements
  - AT2 phase field
  - hybrid tensile-energy driving force
  - alternating minimisation
  - sparse LU
  dependencies:
  - numpy
  - scipy
  - matplotlib
  complexity: low
  relevance: Small enough to reproduce exactly and re-implement independently; the first Stabileo Research
    entry and the pattern for the rest.
  status: numerically-validated
  reproduced_published_results: false
  benchmarks:
  - bar under tension vs 1D AT2 analytical stress
  - single-edge notched tension force-displacement
  - three-point bending force-displacement
  implementation: fracture/shauer-2025
  contacts: []
