    title: Snapping and switching of elastic arches with patterned preferred curvature
    authors:
    - Michał Zmyślony
    - Ammar Khan
    - John S. Biggins
    year: 2026
    venue: Physical Review Research
  area: metamaterials
  keywords:
  - elastic arch
  - snap-through
  - bistability
  - preferred curvature
  - Euler buckling modes
  summary: Elastica theory and photomechanical experiments on an arch whose preferred curvature varies
    along its length and in time. A shallow-arch theory projects the curvature pattern onto Euler buckling
    modes; overlap with the fundamental mode makes the arch snap, other patterns give a continuous switch
    to a higher mode. Patterns with the largest energy release and the lowest threshold are found, and
    the same control applies to passive pre-curved arches loaded at the boundaries.
  summary_source: crossref-abstract
  code: []
  data:
