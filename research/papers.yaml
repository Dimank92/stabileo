  summary: Uses Koiter's asymptotic post-buckling expansion in sizing and topology optimization of trusses
    and frames. Constraining the first two asymptotic coefficients (initial post-buckling slope and curvature)
    shapes the post-buckling response and lowers imperfection sensitivity, and the same expansion approximates
    the nonlinear response so that measures such as end-compliance can be optimized.
