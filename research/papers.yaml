  - experiments
  dependencies: []
  complexity: low
  relevance: Queue item 5. The theory's basis is the Euler buckling modes the production engine already
    computes; passive arches run on the 2D corotational and arc-length solvers. Zenodo record (data and
    software, CC-BY-4.0 per the record) not yet inspected file by file.
