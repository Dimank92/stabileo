[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# There used to be an `[unstable] build-std` here "for a JS-backed Instant::now() in WASM". Only a
# nightly reads it, and the WASM has always been built on stable, which ignores it; the clocks the
# engine reads in WASM are gated off (`solver/linear.rs`, `now_micros`). On CI's nightly it rebuilt
# std for every native test build, for nothing.
