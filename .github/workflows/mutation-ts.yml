name: Mutation testing (TypeScript engine logic)

# Stryker over the safety-relevant TypeScript in web/src/lib/engine (web/stryker.config.json
# lists the modules). Nightly, because a full run takes far longer than a PR should wait; on
# demand from the Actions tab. Sharded into 4 matrix jobs so runs complete within reasonable
# timeouts (~30-60 min each) rather than hitting the single-runner 345 min cap.
# Surviving mutants in the critical modules are listed in docs/verification/TS_ENGINE_LOGIC.md.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: cirsoc-codes
            mutate: "src/lib/engine/codes/argentina/cirsoc201-basis.ts,src/lib/engine/codes/argentina/cirsoc201-beam-kernel.ts,src/lib/engine/codes/argentina/cirsoc201-engine-gate.ts,src/lib/engine/codes/argentina/cirsoc301.ts,src/lib/engine/codes/argentina/serviceability.ts"
          - name: detailing
            mutate: "src/lib/engine/detailing/foundation-check.ts,src/lib/engine/detailing/punching-shear.ts,src/lib/engine/design-check-results.ts"
          - name: design-engine
            mutate: "src/lib/engine/auto-verify.ts,src/lib/engine/design/candidate-search.ts,src/lib/engine/design/outcome.ts"
          - name: cirsoc-spacing
            mutate: "src/lib/codes/cirsoc201/anchorage.ts,src/lib/codes/cirsoc201/spacing.ts,src/lib/codes/cirsoc201/transverse-spacing.ts"
    name: stryker (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown

      # Pinned release, checksum-verified by install-action (as in ci.yml). This
      # step used to run .github/scripts/install-wasm-pack.sh, which is not in
      # the repository: the first scheduled run failed here.
      - name: Install wasm-pack
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-pack@0.13.1
        timeout-minutes: 5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build WASM engine
        working-directory: engine
        run: wasm-pack build --target web --out-dir ../web/src/lib/wasm --no-opt

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Stryker
        working-directory: web
        run: npx stryker run --mutate "${{ matrix.shard.mutate }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report-${{ matrix.shard.name }}
          path: web/reports/mutation/
          retention-days: 30
